<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ホワイトスターズ</title>
<!-- ホーム画面のアイコンと名前 -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ホワイトスターズ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<style>
  html, body { margin: 0; height: 100%; background: #ffffff; }
  body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); box-sizing: border-box; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
  .loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
             font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; color: #737373; font-size: 13px; background: #fff; transition: opacity .3s; }
  .loading img { width: 96px; height: 96px; border-radius: 50%; }
  .loading a { color: #0095f6; font-weight: 600; text-decoration: none; }
  .hide { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div class="loading" id="loading">
  <img src="apple-touch-icon.png" alt="佃ホワイトスターズ">
  <div>読み込み中…</div>
  <a id="direct" href="#">開かないときはこちら</a>
</div>
<iframe id="app" title="佃ホワイトスターズ スコア" allow="clipboard-write; web-share"></iframe>
<script>
  // ↓↓↓ ここに Apps Script のウェブアプリのURL（…/exec で終わるもの）を貼り付けます ↓↓↓
  const APP_URL = "https://script.google.com/macros/s/AKfycbweIRgYy232wBN7NpiaIvq5c7uMO4HSXI_1YxwWIjKJfUUu08jeh_aEWAd-iZr4FUJg1w/exec";
  // ↑↑↑ ここまで ↑↑↑

  const frame = document.getElementById("app");
  const loading = document.getElementById("loading");
  document.getElementById("direct").href = APP_URL;
  if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/.test(APP_URL)) {
    loading.querySelector("div").textContent = "アプリのURLがまだ設定されていません（index.html の APP_URL）";
  } else {
    frame.src = APP_URL;
    frame.addEventListener("load", () => loading.classList.add("hide"));
    setTimeout(() => loading.classList.add("hide"), 8000);
  }
</script>
</body>
</html>
